<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>咒术回战 · 同人游戏</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 标题画面 ===== -->
  <div id="screen-title" class="screen">
    <div class="title-container">
      <h1 class="game-title">呪術廻戦</h1>
      <p class="game-subtitle">同人 RPG</p>
      <div class="title-buttons">
        <button id="btn-new-game" class="btn btn-primary">新游戏</button>
        <button id="btn-continue" class="btn btn-secondary">继续</button>
        <button id="btn-credits" class="btn btn-secondary">制作名单</button>
      </div>
      <p id="no-save-hint" class="hint-text hidden">无存档</p>
    </div>
  </div>

  <!-- ===== 角色创建 - Step 1: 输入名字 ===== -->
  <div id="screen-create-name" class="screen hidden">
    <div class="create-container">
      <h2 class="create-title">创建角色</h2>
      <div class="step-indicator">Step 1 / 3</div>
      <div class="form-group">
        <label for="input-name">请输入角色名：</label>
        <input type="text" id="input-name" placeholder="请输入名字（3-20字符）" maxlength="20">
        <p id="name-error" class="error-text hidden"></p>
      </div>
      <div class="create-buttons">
        <button id="btn-name-next" class="btn btn-primary" disabled>下一步</button>
      </div>
    </div>
  </div>

  <!-- ===== 角色创建 - Step 2: Roll点 ===== -->
  <div id="screen-create-roll" class="screen hidden">
    <div class="create-container">
      <h2 class="create-title">掷骰判定</h2>
      <div class="step-indicator">Step 2 / 3</div>
      <p class="roll-hint">剩余重掷次数：<span id="reroll-count">3</span></p>
      <div id="roll-attributes" class="roll-attributes">
        <!-- 动态渲染 -->
      </div>
      <div id="roll-rank" class="roll-rank">
        <!-- 动态渲染 -->
      </div>
      </div>
      <p id="roll-flavor" class="flavor-text"></p>
      <!-- 储存结果展示区 -->
      <div id="saved-roll-area" class="saved-roll-area hidden">
        <h3>📦 已储存的六维</h3>
        <div id="saved-roll-attrs" class="roll-attributes"></div>
        <p id="saved-roll-rank" class="saved-roll-rank"></p>
      </div>
      <div class="create-buttons" id="roll-buttons">
        <button id="btn-reroll" class="btn btn-primary">舍弃并重掷</button>
        <button id="btn-save-reroll" class="btn btn-secondary" disabled>储存并重掷</button>
        <button id="btn-use-current" class="btn btn-secondary">直接选择该六维</button>
      </div>
    </div>
  </div>

  <!-- ===== 角色创建 - Step 2.5: 自由加点 ===== -->
  <div id="screen-create-bonus" class="screen hidden">
    <div class="create-container">
      <h2 class="create-title">自由加点</h2>
      <div class="step-indicator">Step 2.5 / 3</div>
      <p class="roll-hint">剩余自由点数：<span id="bonus-points">3</span></p>
      <p class="flavor-text">你可以将这 3 点自由分配到任意属性上，以解锁心仪的术式。</p>
      <div id="bonus-attributes" class="roll-attributes">
        <!-- 动态渲染 -->
      </div>
      <div class="create-buttons">
        <button id="btn-bonus-prev" class="btn btn-secondary">返回重掷</button>
        <button id="btn-bonus-next" class="btn btn-primary" disabled>确认（剩余点数必须用完）</button>
      </div>
    </div>
  </div>


  <!-- ===== 角色创建 - Step 3: 术式与咒缚 ===== -->
  <div id="screen-create-choices" class="screen hidden">
    <div class="create-container">
      <h2 class="create-title">选择术式与天与咒缚</h2>
      <div class="step-indicator">Step 3 / 3</div>

      <h3>术式选择</h3>
      <div id="technique-grid" class="card-grid">
        <!-- 动态渲染 -->
      </div>

      <h3>天与咒缚（可选）</h3>
      <div id="binding-grid" class="card-grid">
        <!-- 动态渲染 -->
      </div>

      <div class="create-buttons">
        <button id="btn-choices-prev" class="btn btn-secondary">上一步</button>
        <button id="btn-confirm-create" class="btn btn-primary" disabled>确认创建</button>
      </div>
    </div>
  </div>

  <!-- ===== 主界面 HUD ===== -->
  <div id="screen-main" class="screen hidden">
    <!-- 顶部状态栏 -->
    <div id="hud-bar" class="hud-bar">
      <div class="hud-left">
        <span id="hud-name">--</span>
        <span id="hud-rank" class="hud-rank">--</span>
      </div>
      <div class="hud-center">
        <div class="hud-stat">
          <span class="stat-label">HP</span>
          <div class="stat-bar-bg"><div id="hud-hp-bar" class="stat-bar hp-bar"></div></div>
          <span id="hud-hp-text" class="stat-text">--/--</span>
        </div>
        <div class="hud-stat">
          <span class="stat-label">MP</span>
          <div class="stat-bar-bg"><div id="hud-mp-bar" class="stat-bar mp-bar"></div></div>
          <span id="hud-mp-text" class="stat-text">--/--</span>
        </div>
      </div>
      <div class="hud-right">
        <span class="hud-resource">💰 <span id="hud-money">0</span></span>
        <span class="hud-resource">⚡ <span id="hud-ap">0</span></span>
      </div>
    </div>

    <!-- 主菜单按钮 -->
    <div id="main-menu" class="main-menu">
      <button class="btn btn-menu" data-action="train">修炼</button>
      <button class="btn btn-menu" data-action="learn">请教</button>
      <button class="btn btn-menu" data-action="quest">任务</button>
      <button class="btn btn-menu" data-action="explore">探索</button>
      <button class="btn btn-menu" data-action="shop">商店</button>
    </div>

    <!-- 系统按钮 -->
    <div class="system-buttons">
      <button id="btn-skilltree" class="btn btn-system">技能树</button>
      <button id="btn-domain-detail" class="btn btn-system">高级技巧</button>
      <button id="btn-items" class="btn btn-system">道具</button>
      <button id="btn-equipment" class="btn btn-system">装备</button>
      <button id="btn-bestiary" class="btn btn-system">图鉴</button>
      <button id="btn-rest" class="btn btn-system">休息</button>
      <button id="btn-save" class="btn btn-system">存档</button>
      <button id="btn-load" class="btn btn-system">读档</button>
      <button id="btn-back-title" class="btn btn-system">返回标题</button>
    </div>
  </div>

  <!-- ===== 战斗界面 ===== -->
  <div id="screen-battle" class="screen hidden">
    <div class="battle-container">
      <!-- 加载中遮罩 -->
      <div id="battle-loading" class="battle-loading">
        <p id="battle-loading-text">正在加载战斗环境...</p>
      </div>

      <!-- 敌方信息 -->
      <div class="battle-enemy-section">
        <div class="battle-char-card">
          <div class="battle-char-name" id="enemy-name">--</div>
          <div class="battle-stat-row">
            <span class="stat-label">HP</span>
            <div class="stat-bar-bg battle-bar-wide">
              <div id="enemy-hp-bar" class="stat-bar hp-bar"></div>
            </div>
            <span id="enemy-hp-text" class="stat-text">--/--</span>
          </div>
          <div class="battle-stat-row">
            <span class="stat-label">ATB</span>
            <div class="stat-bar-bg battle-bar-wide">
              <div id="enemy-atb-bar" class="stat-bar" style="background: #eab308;"></div>
            </div>
            <span id="enemy-atb-text" class="stat-text">0/300</span>
          </div>
        </div>
      </div>

      <!-- 战斗日志 -->
      <div id="battle-log" class="battle-log">
        <!-- 动态追加 -->
      </div>

      <!-- Phase 9: 召唤物/式神状态栏 -->
      <div id="battle-summons" class="battle-summons" style="display:none;">
        <!-- 动态渲染式神/召唤物卡片 -->
      </div>

      <!-- 玩家信息 -->
      <div class="battle-player-section">
        <div class="battle-char-card">
          <div class="battle-char-name" id="player-name">--</div>
          <div class="battle-stat-row">
            <span class="stat-label">HP</span>
            <div class="stat-bar-bg battle-bar-wide">
              <div id="player-hp-bar" class="stat-bar hp-bar"></div>
            </div>
            <span id="player-hp-text" class="stat-text">--/--</span>
          </div>
          <div class="battle-stat-row">
            <span class="stat-label">MP</span>
            <div class="stat-bar-bg battle-bar-wide">
              <div id="player-mp-bar" class="stat-bar mp-bar"></div>
            </div>
            <span id="player-mp-text" class="stat-text">--/--</span>
          </div>
          <div class="battle-stat-row">
            <span class="stat-label">ATB</span>
            <div class="stat-bar-bg battle-bar-wide">
              <div id="player-atb-bar" class="stat-bar" style="background: #eab308;"></div>
            </div>
            <span id="player-atb-text" class="stat-text">0/300</span>
          </div>
        </div>
      </div>

      <!-- 技能/束缚/领域按钮区（折叠式） -->
      <div id="battle-skills" class="battle-skills">
        <!-- Phase 7: 内容由 _renderCollapsibleSection 动态创建 -->
      </div>

      <!-- 束缚按钮区（保留 ID 兼容旧代码） -->
      <div id="battle-vows" style="display:none;"></div>

      <!-- 撤离按钮 -->
      <div class="battle-bottom-btns">
        <button id="btn-battle-flee" class="btn btn-system">撤离</button>
      </div>
    </div>
  </div>

  <!-- ===== 读档界面 ===== -->
  <div id="screen-load" class="screen hidden">
    <div class="load-container">
      <h2 class="create-title">读档</h2>
      <div id="load-slots" class="load-slots">
        <!-- 动态渲染 -->
      </div>
      <div class="create-buttons">
        <button id="btn-load-back" class="btn btn-secondary">返回</button>
      </div>
    </div>
  </div>

  <!-- ===== 覆盖存档确认界面 ===== -->
  <div id="screen-save-overwrite" class="screen hidden">
    <div class="load-container">
      <h2 class="create-title">存档槽位已满</h2>
      <p>请选择一个槽位覆盖：</p>
      <div id="overwrite-slots" class="load-slots">
        <!-- 动态渲染 -->
      </div>
      <div class="create-buttons">
        <button id="btn-overwrite-cancel" class="btn btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <!-- ===== 通用弹窗 ===== -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="modal-message"></p>
      <div class="modal-buttons">
        <button id="modal-confirm" class="btn btn-primary">确认</button>
        <button id="modal-cancel" class="btn btn-secondary hidden">取消</button>
      </div>
    </div>
  </div>

  <!-- ===== 脚本 ===== -->
  <script src="lib/pyodide/pyodide.js"></script>
  <script type="module" src="js/app.js?v=phase13-final"></script>
</body>
</html>
